# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

# Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.caching=true
# Configuration cache stays off until the Apple/cinterop tasks are proven clean with it.
org.gradle.configuration-cache=false

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Build with JDK 17: export JAVA_HOME (see README). Do not put org.gradle.java.home here.

# Lets the shared iosMain source set (and its published metadata) see the PantauShim cinterop.
kotlin.mpp.enableCInteropCommonization=true
